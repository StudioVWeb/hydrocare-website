# Non-deploy experiment: install Impeccable for Claude Code and benchmark Hydrocare.
# Never references Cloudflare credentials, domains, production or other repositories.
name: Hydrocare / Impeccable pilot (no deploy)

on:
  push:
    branches:
      - experiment/impeccable-hydrocare-20261029
  workflow_dispatch:

permissions:
  contents: write # Only to save generated Claude skill files on this pilot branch.

concurrency:
  group: hydrocare-impeccable-pilot
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/experiment/impeccable-hydrocare-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      DO_NOT_TRACK: "1"
      IMPECCABLE_NO_TELEMETRY: "1"
      NO_COLOR: "1"
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify source and generated preview
        run: |
          python3 build.py
          python3 scripts/check.py
          node --check dist/app.js

      - name: Install pinned Impeccable Claude Code skill (noninteractive)
        run: |
          npx --yes impeccable@4.8.0 install -y --providers=claude --scope=project --no-hooks
          test -s .claude/skills/impeccable/SKILL.md
          npx --yes impeccable@4.8.0 --version

      - name: Detect source issues
        shell: bash
        run: |
          mkdir -p reports/impeccable
          set +e
          npx --yes impeccable@4.8.0 detect --json dist > reports/impeccable/source.json 2> reports/impeccable/source.stderr
          result=$?
          set -e
          echo "$result" > reports/impeccable/source.exit
          echo "Source detector exit: $result (0=clean, 2=findings, 1=scan failed)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then
            cat reports/impeccable/source.stderr
            exit 1
          fi

      - name: Detect rendered pages
        shell: bash
        run: |
          mkdir -p reports/impeccable/rendered
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/hydrocare-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          for route in home diensten realisaties over contact privacy; do
            case "$route" in home) path=/ ;; *) path="/$route/" ;; esac
            set +e
            npx --yes impeccable@4.8.0 detect --json "http://127.0.0.1:4173$path" > "reports/impeccable/rendered/$route.json" 2> "reports/impeccable/rendered/$route.stderr"
            result=$?
            set -e
            echo "$result" > "reports/impeccable/rendered/$route.exit"
            echo "$route: detector exit $result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then
              cat "reports/impeccable/rendered/$route.stderr"
              exit 1
            fi
          done

      - name: Attach raw Impeccable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrocare-impeccable-baseline
          path: reports/impeccable/
          if-no-files-found: warn
          retention-days: 14

      - name: Save installed skill and auditable CI report on pilot branch
        if: success() && github.ref == 'refs/heads/experiment/impeccable-hydrocare-20261029'
        shell: bash
        run: |
          mkdir -p docs/impeccable
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          base = Path("reports/impeccable")
          lines = [
              "# Hydrocare Impeccable CI baseline",
              "",
              "Generated by GitHub Actions; only a *detector benchmark*, not a Claude-generated design review.",
              f"UTC: {datetime.now(timezone.utc).isoformat(timespec='seconds')}",
              "CLI/skill: impeccable@4.8.0",
              "",
              "| Target | Detector exit | Reported findings |",
              "| --- | --- | --- |",
          ]
          for stem in [base / "source", *sorted((base / "rendered").glob("*.json"))]:
              raw = stem if stem.suffix == ".json" else stem.with_suffix(".json")
              code_file = raw.with_suffix(".exit")
              exit_code = code_file.read_text().strip() if code_file.exists() else "not-run"
              try:
                  data = json.loads(raw.read_text())
                  if isinstance(data, list):
                      count = str(len(data))
                  elif isinstance(data, dict):
                      for k in ("findings", "issues", "results", "diagnostics"):
                          if isinstance(data.get(k), list):
                              count = str(len(data[k]))
                              break
                      else:
                          count = "check raw JSON artifact"
                  else:
                      count = "unknown JSON shape"
              except Exception as exc:
                  count = f"JSON parse error: {type(exc).__name__}"
              lines.append(f"| {raw.parent.name}/{raw.stem} | {exit_code} | {count} |")
          # Keep representative detector findings in git for an auditable review.
          from collections import Counter
          def findings_for(file):
              try:
                  value = json.loads(file.read_text(encoding="utf-8"))
              except Exception:
                  return []
              if isinstance(value, list):
                  return value
              if isinstance(value, dict):
                  for k in ("findings", "issues", "results", "diagnostics"):
                      if isinstance(value.get(k), list):
                          return value[k]
              return []
          def name_of(issue):
              if not isinstance(issue, dict):
                  return "unstructured"
              rule = next((issue.get(k) for k in ("antipattern", "ruleId", "rule_id", "rule", "ruleName", "name", "id", "code") if issue.get(k)), "unknown")
              if isinstance(rule, dict):
                  rule = rule.get("id") or rule.get("name") or "unknown"
              return str(rule).replace("|", "/")[:100]
          def message_of(issue):
              if not isinstance(issue, dict):
                  return str(issue)[:160]
              msg = issue.get("message") or issue.get("description") or issue.get("title") or ""
              if isinstance(msg, dict):
                  msg = msg.get("text") or str(msg)
              return " ".join(str(msg).replace("|", "/").split())[:160]
          source_issues = findings_for(base / "source.json")
          homepage_issues = findings_for(base / "rendered" / "home.json")
          counts = Counter(name_of(item) for item in source_issues)
          severity_counts = Counter(str(item.get("severity", "unknown")) for item in source_issues if isinstance(item, dict))
          category_counts = Counter(str(item.get("category", "unknown")) for item in source_issues if isinstance(item, dict))
          lines += ["", "## Severity and category in source", "", "| Kind | Label | Count |", "| --- | --- | ---: |"]
          for label, n in severity_counts.most_common():
              lines.append(f"| Severity | {label} | {n} |")
          for label, n in category_counts.most_common():
              lines.append(f"| Category | {label} | {n} |")
          if source_issues and isinstance(source_issues[0], dict):
              first = source_issues[0]
              lines += [
                  "",
                  "## Detector JSON fields (diagnostic)",
                  "",
                  "Keys: " + ", ".join(sorted(str(k) for k in first.keys())),
                  "",
                  "First finding without long message:",
                  "",
                  "```json",
                  json.dumps({k:v for k,v in first.items() if k not in ("message", "description", "html")}, ensure_ascii=False, default=str, indent=2)[:1400],
                  "```",
              ]
          lines += ["", "## Most common source rules", "", "| Rule | Count |", "| --- | ---: |"]
          for rule, count in counts.most_common(15):
              lines.append(f"| {rule} | {count} |")
          lines += ["", "## Homepage: sample of raw findings", "", "| Rule | Detector message |", "| --- | --- |"]
          for item in homepage_issues[:18]:
              lines.append(f"| {name_of(item)} | {message_of(item)} |")
          lines += [
              "",
              "Exit code 0 = no finding; 2 = findings; 1 = scan error. The exact rule output is saved as a GitHub Actions artifact for this run.",
              "The local Claude Code design hook is **not** installed by this CI run (`--no-hooks`). Activate it when using Claude Code locally.",
              "No preview deployment, production update or merge was performed by this workflow.",
              "",
          ]
          Path("docs/impeccable/ci-results.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/impeccable docs/impeccable/ci-results.md
          if git diff --cached --quiet; then
            echo "Installed skill and result report already committed." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "test: record Impeccable skill and Hydrocare detector baseline [skip ci]"
            git push origin HEAD:experiment/impeccable-hydrocare-20261029
            echo "Installed skill and baseline committed to experiment branch." >> "$GITHUB_STEP_SUMMARY"
          fi
